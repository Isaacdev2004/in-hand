# Codemagic — In Hand iOS (no Mac required)
# Setup guide: docs/CODEMAGIC_SETUP.md
# Signing: docs/CODEMAGIC_SETUP.md → "Generate certificate in Codemagic UI" (required once)
workflows:
  ios-build:
    name: In Hand iOS (build only)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "In hand"
    environment:
      groups:
        - inhand_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.inhand.collector
      vars:
        BUNDLE_ID: com.inhand.collector
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        NODE_OPTIONS: --max_old_space_size=4096
      node: 22
      xcode: latest
    scripts:
      - name: Install and build web app
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Set up code signing and build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: In Hand iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "In hand"
    environment:
      groups:
        - inhand_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.inhand.collector
      vars:
        BUNDLE_ID: com.inhand.collector
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_ID: com.inhand.collector
        NODE_OPTIONS: --max_old_space_size=4096
      node: 22
      xcode: latest
    scripts:
      - name: Install and build web app
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Set up code signing and build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
