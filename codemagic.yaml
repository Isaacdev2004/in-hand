# Codemagic — In Hand iOS (no Mac required)
# Setup guide: docs/CODEMAGIC_SETUP.md
workflows:
  # Step 1: run this first to verify signing + build
  ios-build:
    name: In Hand iOS (build only)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "In hand"
    environment:
      vars:
        BUNDLE_ID: com.inhand.collector
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        NODE_OPTIONS: --max_old_space_size=4096
      node: 20
      xcode: latest
    scripts:
      - name: Install and build web app
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Fetch signing files and build IPA
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # Step 2: after ios-build succeeds — uploads to TestFlight
  ios-release:
    name: In Hand iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "In hand"
    environment:
      vars:
        BUNDLE_ID: com.inhand.collector
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_ID: com.inhand.collector
        NODE_OPTIONS: --max_old_space_size=4096
      node: 20
      xcode: latest
    scripts:
      - name: Install and build web app
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Fetch signing files and build IPA
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
