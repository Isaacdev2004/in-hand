# Codemagic — In Hand iOS (no Mac required)
# Setup: docs/CODEMAGIC_SETUP.md
# Required in group inhand_env: CERTIFICATE_PRIVATE_KEY (generate once — see docs)
workflows:
  ios-build:
    name: In Hand iOS (build only)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "In hand"
    environment:
      groups:
        - inhand_env
      vars:
        BUNDLE_ID: com.inhand.collector
        APPLE_TEAM_ID: 88L7JJ3Z28
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        NODE_OPTIONS: --max_old_space_size=4096
      node: 22
      xcode: latest
    scripts:
      - name: Install and build web app
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Set up code signing and build IPA
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: Add CERTIFICATE_PRIVATE_KEY to Codemagic group inhand_env"
            echo "Generate with: openssl genrsa 2048"
            exit 1
          fi
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl rsa -check -noout 2>/dev/null || {
            echo "ERROR: CERTIFICATE_PRIVATE_KEY must be RSA 2048."
            echo "Run: openssl genrsa 2048"
            echo "Copy the full output (BEGIN RSA PRIVATE KEY ... END RSA PRIVATE KEY) into Codemagic."
            exit 1
          }
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          KEYCHAIN_PATH=$(keychain get-default)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH" 2>/dev/null || true
          security find-identity -v -p codesigning
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: In Hand iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "In hand"
    environment:
      groups:
        - inhand_env
      vars:
        BUNDLE_ID: com.inhand.collector
        APPLE_TEAM_ID: 88L7JJ3Z28
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_ID: com.inhand.collector
        NODE_OPTIONS: --max_old_space_size=4096
      node: 22
      xcode: latest
    scripts:
      - name: Install and build web app
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Set up code signing and build IPA
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ERROR: Add CERTIFICATE_PRIVATE_KEY to Codemagic group inhand_env"
            echo "Generate with: openssl genrsa 2048"
            exit 1
          fi
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl rsa -check -noout 2>/dev/null || {
            echo "ERROR: CERTIFICATE_PRIVATE_KEY must be RSA 2048."
            echo "Run: openssl genrsa 2048"
            echo "Copy the full output (BEGIN RSA PRIVATE KEY ... END RSA PRIVATE KEY) into Codemagic."
            exit 1
          }
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          KEYCHAIN_PATH=$(keychain get-default)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH" 2>/dev/null || true
          security find-identity -v -p codesigning
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Assign internal testers in App Store Connect → TestFlight.
        # (Avoids external beta review + beta_groups name mismatch in post-processing.)
